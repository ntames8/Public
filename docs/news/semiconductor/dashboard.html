:root{

}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.07);

  }
}
:root[data-theme="dark"]{

  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.07);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --good-text:#0ca30c;

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--font)}
.wrap{max-width:1240px;margin:0 auto;padding:16px 20px 48px}
h1{font-size:20px;margin:0}
h2{font-size:15px;margin:28px 0 10px;color:var(--ink)}
h3{font-size:13px;margin:0;font-weight:600}
.sub{color:var(--ink2);font-size:12px}
.muted{color:var(--muted)}
.top{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:14px 0 4px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;position:sticky;top:0;z-index:5}
.group{display:flex;align-items:center;gap:6px}
.group>label{color:var(--ink2);font-size:12px}
button,select,input{font:inherit;color:var(--ink)}
.btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;min-height:32px}
.btn:hover{background:var(--wash)}
.btn[aria-pressed="true"],.chip[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,select:focus-visible,svg:focus-visible,input:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
.chips{display:flex;gap:4px;overflow-x:auto;max-width:100%;padding:2px}
.chip{border:1px solid var(--border);background:transparent;border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap;font-size:12px;min-height:28px}
.chip:hover{background:var(--wash)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--border);background:transparent;padding:5px 10px;cursor:pointer;min-height:32px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--wash)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.banner{margin:10px 0 0;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{font-weight:600}
.banner[hidden]{display:none}
.status{white-space:nowrap}
.tile .meta{flex-wrap:wrap}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.charts{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;position:relative}
.tile .lab{color:var(--ink2);font-size:12px}
.tile .val{font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2;margin:2px 0}
.tile .meta{display:flex;justify-content:space-between;gap:6px;color:var(--ink2);font-size:12px;align-items:center}
.tile svg{display:block;margin-top:6px}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--border);border-radius:999px;padding:0 8px;color:var(--ink)}
.status i{display:inline-block;width:9px;height:9px}
.st-good i{background:var(--good);border-radius:50%}
.st-warn i{background:var(--warn);clip-path:polygon(50% 0,100% 100%,0 100%)}
.st-crit i{background:var(--crit);transform:rotate(45deg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink2);font-size:12px;margin:4px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2.5px solid}
.legend i.box{height:10px;width:10px;border:0;border-radius:2px}
.legend i.dash{border-top-style:dashed;border-top-width:2px;opacity:.7}
.plot{position:relative}
svg text{font-family:var(--font)}
.note{color:var(--ink2);font-size:12px;margin-top:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{color:var(--ink2);font-weight:600}
.scroll{overflow-x:auto}
.board{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.board .row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.assess{white-space:pre-line;color:var(--ink);font-size:13px;line-height:1.6}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.flags span{border:1px solid var(--border);border-radius:6px;padding:1px 8px;font-size:12px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--ink2)}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin-top:8px}
.th-grid label{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.th-grid input{width:70px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);border:1px solid var(--axis);border-radius:8px;
  padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none;max-width:280px}
#tip .hd{color:var(--ink2);margin-bottom:4px}
#tip .r{display:flex;align-items:center;gap:8px;margin-top:2px}
#tip .r i{display:inline-block;width:12px;border-top:2.5px solid}
#tip .r b{font-size:13px;font-weight:600;color:var(--ink)}
#tip .r span{color:var(--ink2)}
#tip .rev{color:var(--ink2);margin-left:20px;font-size:11px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{margin-top:28px;color:var(--muted);font-size:12px}
@media (max-width:640px){.charts{grid-template-columns:1fr}.filters{position:static}}
@media print{.filters{position:static}.btn,.seg{display:none}}

const tip = $('#tip');
function showTip(rows, head, x, y){
  tip.replaceChildren(h('div',{class:'hd',text:head}),
    ...rows.map(r => h('div',null,
      h('div',{class:'r'}, h('i',{style:`border-color:${r.color}`}), h('b',{text:r.value}), h('span',{text:r.label})),
      r.rev ? h('div',{class:'rev',text:r.rev}) : null)));
  tip.style.display='block';
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  let L = x+14, T = y-hh-10; if (L+w > innerWidth-8) L = x-w-14; if (T<8) T = y+16;
  tip.style.left = Math.max(8,L)+'px'; tip.style.top = T+'px';
}
const hideTip = () => { tip.style.display='none'; };

/* ───────── 눈금 ───────── */
function niceTicks(min,max,n=4){
  if (min===max){ min-=1; max+=1; }
  const raw=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), nr=raw/mag;
  const step=(nr<1.5?1:nr<3?2:nr<7?5:10)*mag;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for (let v=lo; v<=hi+step/2; v+=step) t.push(+v.toPrecision(12));
  return {lo,hi,ticks:t};
}

/* ───────── 선 차트 ───────── */
function lineChart(cfg){
  const snap = cur(), pv = state.compare ? prevSnap() : null;
  const data = cfg.series.map(sr => ({
    sr, pts: clip(getSeries(snap, sr.key, cfg.freq), cfg.freq, snap),

  }));
  const card = h('div',{class:'card'});
  const m0 = meta(cfg.series[0].key);
  card.append(h('h3',{text:cfg.title}), h('div',{class:'sub',text:cfg.sub||''}));
  if (cfg.series.length>1 || (pv)) {
    const lg = h('div',{class:'legend'});
    cfg.series.forEach(sr => lg.append(h('span',null, h('i',{style:`border-color:var(${sr.cv})`}), sr.label)));
    if (pv) lg.append(h('span',null, h('i',{class:'dash',style:'border-color:var(--ink2)'}), '직전 호 값(개정 시)'));
    if (cfg.th) {
      lg.append(h('span',null, h('i',{class:'dash',style:'border-color:var(--warn)'}), '주의선'));
      lg.append(h('span',null, h('i',{class:'dash',style:'border-color:var(--crit)'}), '경고선'));
    }
    card.append(lg);
  }
  const xs = [...new Set(data.flatMap(d=>d.pts.map(p=>p[0])))].sort((a,b)=>pEnd(a)-pEnd(b));
  if (!xs.length){ card.append(h('div',{class:'note',text:'표시할 데이터가 없습니다.'})); return card; }

  const host = h('div',{class:'plot'}); card.append(host);
  const draw = () => {
    host.replaceChildren();
    const W = Math.max(300, host.clientWidth || card.clientWidth-28 || 360), H = cfg.h||210;
    const M = {l:46,r:14,t:12,b:26}, iw=W-M.l-M.r, ih=H-M.t-M.b;
    let vals = data.flatMap(d=>d.pts.map(p=>p[1]));
    if (cfg.th){ const t=TH[cfg.th]; vals = vals.concat([t.warn,t.crit]); }
    if (data.some(d=>d.prev)) data.forEach(d=>d.pts.forEach(([p])=>{ const v=d.prev&&d.prev.get(p); if (v!=null) vals.push(v); }));
    let mn=Math.min(...vals), mx=Math.max(...vals);
    if (cfg.zero!==false && mn>0) mn=0;
    const T = niceTicks(mn,mx,4);
    const X = i => M.l + (xs.length===1? iw/2 : i*iw/(xs.length-1));
    const Y = v => M.t + ih - (v-T.lo)/(T.hi-T.lo)*ih;
    const svg = sv('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,role:'img',tabindex:0,
      'aria-label':`${cfg.title}. 최신 ${pLong(xs[xs.length-1])}: `+data.map(d=>{const l=d.pts[d.pts.length-1];return `${d.sr.label} ${l?fmt(l[1],m0.unit):'–'}`}).join(', ')});
    T.ticks.forEach(t=>{
      svg.append(sv('line',{x1:M.l,x2:W-M.r,y1:Y(t),y2:Y(t),stroke:t===0?'var(--axis)':'var(--grid)','stroke-width':t===0?1.2:1}));
      svg.append(sv('text',{x:M.l-6,y:Y(t)+4,'text-anchor':'end','font-size':11,fill:'var(--muted)'}, nf.format(t)));
    });
    const step = Math.ceil(xs.length/6);
    xs.forEach((p,i)=>{ if ((xs.length-1-i)%step===0) svg.append(sv('text',{x:X(i),y:H-8,'text-anchor':'middle','font-size':11,fill:'var(--muted)'}, pLab(p))); });
    if (cfg.th){
      const t = TH[cfg.th];
      [['warn','주의'],['crit','경고']].forEach(([k,lab])=>{
        if (t[k]<T.lo || t[k]>T.hi) return;
        svg.append(sv('line',{x1:M.l,x2:W-M.r,y1:Y(t[k]),y2:Y(t[k]),stroke:`var(--${k})`,'stroke-width':1.5,'stroke-dasharray':'5 4'}));
        svg.append(sv('text',{x:M.l+4,y:Y(t[k])-4,'text-anchor':'start','font-size':11,fill:'var(--ink2)'},`${lab} ${nf.format(t[k])}`));
      });
    }
    data.forEach(d=>{
      if (d.prev){
        let path='', pen=false;
        d.pts.forEach(([p])=>{ const v=d.prev.get(p), i=xs.indexOf(p); if (v==null){pen=false;return;} path+=(pen?'L':'M')+X(i)+' '+Y(v)+' '; pen=true; });
        if (path) svg.append(sv('path',{d:path,fill:'none',stroke:'var(--ink2)','stroke-width':1.5,'stroke-dasharray':'4 3',opacity:.75}));
      }
      let path='';
      d.pts.forEach(([p,v],j)=>{ path += (j?'L':'M')+X(xs.indexOf(p))+' '+Y(v)+' '; });
      svg.append(sv('path',{d:path,fill:'none',stroke:`var(${d.sr.cv})`,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
      const last = d.pts[d.pts.length-1];
      if (last){
        const lx=X(xs.indexOf(last[0])), ly=Y(last[1]);
        svg.append(sv('circle',{cx:lx,cy:ly,r:4.5,fill:`var(${d.sr.cv})`,stroke:'var(--surface)','stroke-width':2}));
        svg.append(sv('text',{x:Math.min(lx,W-M.r-2),y:ly-9,'text-anchor':lx>W-60?'end':'middle','font-size':11.5,'font-weight':600,fill:'var(--ink)'}, fmt(last[1],m0.unit)));
      }
    });
    const cross = sv('line',{y1:M.t,y2:M.t+ih,stroke:'var(--ink2)','stroke-width':1,visibility:'hidden'});
    const dots = data.map(d=>sv('circle',{r:4,fill:`var(${d.sr.cv})`,stroke:'var(--surface)','stroke-width':2,visibility:'hidden'}));
    svg.append(cross, ...dots);
    const overlay = sv('rect',{x:M.l,y:M.t,width:iw,height:ih,fill:'transparent'});
    svg.append(overlay);
    const at = (i, cx, cy) => {
      i = Math.max(0, Math.min(xs.length-1, i)); const p = xs[i];
      cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i)); cross.setAttribute('visibility','visible');
      const rows = [];
      data.forEach((d,k)=>{
        const f = d.pts.find(q=>q[0]===p);
        if (f){ dots[k].setAttribute('cx',X(i)); dots[k].setAttribute('cy',Y(f[1])); dots[k].setAttribute('visibility','visible'); }
        else dots[k].setAttribute('visibility','hidden');
        const pr = d.prev && d.prev.get(p);
        rows.push({color:`var(${d.sr.cv})`, value:f?fmt(f[1],meta(d.sr.key).unit):'–', label:d.sr.label,
          rev:(f && pr!=null && Math.abs(pr-f[1])>1e-9)?`직전 호 ${fmt(pr,meta(d.sr.key).unit)} → ${fmt(f[1],meta(d.sr.key).unit)}`:null});
      });
      const r = svg.getBoundingClientRect();
      showTip(rows, pLong(p), cx ?? (r.left + X(i)*r.width/W), cy ?? (r.top + M.t + 20));
      svg._i = i;
    };
    const idxFromEvent = ev => { const r = svg.getBoundingClientRect(); const x=(ev.clientX-r.left)*W/r.width; return Math.round((x-M.l)/(iw)*(xs.length-1)); };
    overlay.addEventListener('pointermove', ev => at(idxFromEvent(ev), ev.clientX, ev.clientY));
    const off = () => { cross.setAttribute('visibility','hidden'); dots.forEach(c=>c.setAttribute('visibility','hidden')); hideTip(); };
    overlay.addEventListener('pointerleave', off); svg.addEventListener('blur', off);
    svg.addEventListener('focus', ()=>at(xs.length-1));
    svg.addEventListener('keydown', ev=>{
      if (ev.key==='ArrowLeft'){ at((svg._i??xs.length-1)-1); ev.preventDefault(); ev.stopPropagation(); }
      else if (ev.key==='ArrowRight'){ at((svg._i??xs.length-1)+1); ev.preventDefault(); ev.stopPropagation(); }
      else if (ev.key==='Escape') off();
    });
    host.append(svg);
  };
  card._draw = draw;
  return card;
}

  const meta2 = h('div',{class:'meta'}, h('span',{text:pLong(p)+' 기준'}));

  // 스파크라인
  const sp = clipSpark(pts.slice(-12));
  if (sp.length>1){
    const W=160,H=34, mn=Math.min(...sp.map(q=>q[1])), mx=Math.max(...sp.map(q=>q[1])), rg=(mx-mn)||1;

function renderRevisions(){

  const out=[];

    for (const p in a) if (p in b && a[p]!=null && b[p]!=null && Math.abs(a[p]-b[p])>1e-9) out.push({k,p,old:b[p],now:a[p]}); }

    const periods = [...new Set(rows.flatMap(r=>r.pts.map(q=>q[0])))].sort((a,b)=>pEnd(a)-pEnd(b));
    if (!periods.length) return;
    const t = h('table',null, h('thead',null, h('tr',null, h('th',{text:'지표 (단위)'}), periods.map(p=>h('th',{text:pLab(p)})))));
    const tb = h('tbody');
    rows.forEach(r=>{ const m=meta(r.k), map=new Map(r.pts);
      tb.append(h('tr',null, h('td',{text:`${m.label}${m.unit?` (${m.unit})`:''}`}), periods.map(p=>h('td',{text:map.has(p)?nf.format(map.get(p)):'–'}))));
      r.pts.forEach(([p,v])=>csvRows.push([freq,r.k,m.label,m.unit,p,v])); });
    t.append(tb);
    wrap.append(h('h2',{text:`${title} 데이터 (${issueLab(snap)}호 시점)`}), h('div',{class:'card scroll'},t));
  });
  wrap.append(h('div',{style:'margin-top:10px'}, h('button',{class:'btn',text:'CSV 내려받기',onclick:()=>{
    const body = '﻿'+csvRows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a = h('a',{href:URL.createObjectURL(new Blob([body],{type:'text/csv;charset=utf-8'})),download:`kdi_${snap.issue}_${state.range||'all'}.csv`}); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }})));
  return wrap;
}

/* ───────── 메인 렌더 ───────── */
function render(){
  const snap = cur();
  const empKey = getSeries(snap,'employed','m').length ? 'employed' : 'employed_pct';
  // 필터 UI 동기화
  const chips = $('#chips'); chips.replaceChildren();
  SNAPS.forEach((s,i)=>{ const b=h('button',{class:'chip',role:'tab','aria-selected':i===state.idx,title:`발행 ${s.published}`,text:issueLab(s)+'호',onclick:()=>setState({idx:i})});
    if (i===state.idx) b.setAttribute('aria-current','true'); chips.append(b); });
  const act = chips.querySelector('[aria-current]'); if (act) act.scrollIntoView({block:'nearest',inline:'center'});
  $('#prev').disabled = state.idx===0; $('#next').disabled = state.idx===SNAPS.length-1; $('#latest').disabled = state.idx===SNAPS.length-1;
  document.querySelectorAll('#range button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.v===state.range));
  document.querySelectorAll('#view button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===state.view));
  $('#compare').setAttribute('aria-pressed', state.compare);
  $('#compare').disabled = state.idx===0;
  $('#srcLink').href = snap.source_url;
  const banner = $('#banner');
  if (state.idx===SNAPS.length-1){ banner.hidden = true; }
  else {
    banner.hidden = false; banner.replaceChildren(h('span',null,'과거 시점 보기: ', h('b',{text:`KDI 경제동향 ${snap.issue.replace('-','년 ')}월호`}), ` (발행 ${snap.published}). 이 화면은 해당 호 발행 시점의 데이터이며 이후 개정은 반영되지 않았습니다.`),
      h('button',{class:'btn',text:'최신 호로 이동',onclick:()=>setState({idx:SNAPS.length-1})}));
  }

  const main = $('#main'); main.replaceChildren();
  main.append(h('div',{class:'sub',style:'margin-top:10px',text:`기준: KDI 경제동향 ${snap.issue.replace('-','년 ')}월호 · 발행 ${snap.published} · 데이터 최신월 ${pLong(`${Math.floor((latestMonthEnd(snap)-1)/12)}-${String((latestMonthEnd(snap)-1)%12+1).padStart(2,'0')}`)}`}));

  main.append(h('h2',{text:'리스크 신호판'}), renderBoard());

  main.append(h('h2',{text:'성장 — 반도체·AI 호황'}));
  const g1 = h('div',{class:'grid tiles'});
  [{key:'gdp_yoy',freq:'q',label:'실질GDP 성장률 (전년동기)'},{key:'gdp_qoq_sa',freq:'q',label:'실질GDP (계절조정 전기대비)'},
   {key:'semi_exports_yoy',label:'반도체 수출 증가율 (YoY)'},{key:'semi_exports_usd',label:'반도체 수출액'},
   {key:'semi_share',label:'반도체 수출 비중',unit:'%'},{key:'exports',label:'총수출 증가율 (통관, YoY)'},
   {key:'equip_investment',label:'설비투자 (YoY)'},{key:'semi_prod_yoy',label:'반도체·부품 생산 (YoY)'}].forEach(o=>g1.append(tile(o)));
  main.append(g1);

  main.append(h('h2',{text:'내수·고용·물가'}));
  const g2 = h('div',{class:'grid tiles'});
  [{key:'private_consumption_yoy',freq:'q',label:'민간소비 (전년동기)'},{key:'retail_sales',label:'소매판매 (YoY)'},{key:'construction',label:'건설기성 (YoY)'},
   {key:empKey,label:empKey==='employed'?'취업자 증가 (전년동월)':'취업자 증가율 (YoY, 7월호 이전 표기)'},{key:'unemployment',label:'실업률'},{key:'cpi',label:'소비자물가 (YoY)'}].forEach(o=>g2.append(tile(o)));
  main.append(g2);

  main.append(h('h2',{text:'리스크 지표 (유가·금리·환율)'}));
  const g3 = h('div',{class:'grid tiles'});
  [{key:'dubai_oil'},{key:'ktb3y'},{key:'usdkrw'},{key:'kospi'}].forEach(o=>g3.append(tile(o)));
  main.append(g3);

  if (state.view==='table'){ main.append(renderTables()); }
  else {
    main.append(h('h2',{text:'추이'}));
    const cs = h('div',{class:'grid charts'});
    cs.append(
      lineChart({title:'반도체 수출 증가율 vs 총수출 증가율',sub:'전년동월대비, %',freq:'m',series:[{key:'semi_exports_yoy',label:'반도체',cv:'--s1'},{key:'exports',label:'총수출(통관)',cv:'--s2'}]}),
      stackChart(),
      lineChart({title:'성장과 내수의 격차',sub:'전년동기대비, % (분기)',freq:'q',series:[{key:'gdp_yoy',label:'실질GDP',cv:'--s1'},{key:'private_consumption_yoy',label:'민간소비',cv:'--s2'}],th:null}),
      lineChart({title:'반도체 생산 vs 전산업 생산',sub:'전년동월대비, %',freq:'m',series:[{key:'semi_prod_yoy',label:'반도체·부품',cv:'--s1'},{key:'all_industry_prod',label:'전산업',cv:'--s2'}]}),
      lineChart({title:'국제유가 (두바이)',sub:'월평균, $/bbl · 점선=임계값',freq:'m',series:[{key:'dubai_oil',label:'두바이유',cv:'--s1'}],th:'dubai_oil',zero:false}),
      lineChart({title:'시장금리 (국고채 3년)',sub:'월말, % · 점선=임계값',freq:'m',series:[{key:'ktb3y',label:'국고채3년',cv:'--s1'}],th:'ktb3y',zero:false}),
      lineChart({title:'원/달러 환율',sub:'월말, 원 · 점선=임계값',freq:'m',series:[{key:'usdkrw',label:'원/달러',cv:'--s1'}],th:'usdkrw',zero:false}),
      lineChart({title:'소비자물가',sub:'전년동월대비, % · 점선=임계값',freq:'m',series:[{key:'cpi',label:'소비자물가',cv:'--s3'}],th:'cpi',zero:false}),
      lineChart({title:empKey==='employed'?'취업자 증감 (전년동월)':'취업자 증가율 (전년동월)',sub:empKey==='employed'?'천명 (KDI 7월호부터 표기)':'% (KDI 7월호 이전 표기)',freq:'m',series:[{key:empKey,label:'취업자',cv:'--s1'}],zero:true}),
      lineChart({title:'반도체 수출 비중',sub:'총수출 대비, % · 점선=임계값 (쏠림 지표)',freq:'m',series:[{key:'semi_share',label:'반도체 비중',cv:'--s1'}],th:'semi_share',zero:false}));
    main.append(cs);
  }

  main.append(h('h2',{text:'직전 호 대비 개정'}), renderRevisions());
  main.append(h('h2',{text:'KDI 평가'}), renderAssessment());
  // 그리기(레이아웃 폭이 확정된 뒤)
  document.querySelectorAll('.card').forEach(c=>{ if (c._draw) c._draw(); });
}

/* ───────── 이벤트 ───────── */
$('#prev').onclick = () => state.idx>0 && setState({idx:state.idx-1});
$('#next').onclick = () => state.idx<SNAPS.length-1 && setState({idx:state.idx+1});
$('#latest').onclick = () => setState({idx:SNAPS.length-1});
document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>setState({range:+b.dataset.v}));
document.querySelectorAll('#view button').forEach(b=>b.onclick=()=>setState({view:b.dataset.v}));
$('#compare').onclick = () => setState({compare:!state.compare});
document.addEventListener('keydown', e=>{
  if (e.target.closest && e.target.closest('svg,input,select,textarea')) return;
  if (e.key==='ArrowLeft'){ if (state.idx>0) setState({idx:state.idx-1}); }
  else if (e.key==='ArrowRight'){ if (state.idx<SNAPS.length-1) setState({idx:state.idx+1}); }
  else if (e.key==='End'){ setState({idx:SNAPS.length-1}); }
  else if (e.key==='Home'){ setState({idx:0}); }
});
let rz; addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>document.querySelectorAll('.card').forEach(c=>c._draw&&c._draw()),120); });
const themeSel = $('#theme');
themeSel.value = localStorage.getItem('theme')||'auto';
document.documentElement.dataset.theme = themeSel.value;
themeSel.onchange = () => { document.documentElement.dataset.theme = themeSel.value; localStorage.setItem('theme', themeSel.value); };
$('#genAt').textContent = D.generated;
render();
</script>
</body>
